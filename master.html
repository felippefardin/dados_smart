<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Master - Dados Smart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; position: fixed; width: 250px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 12px 20px; cursor: pointer; }
        .sidebar a:hover { background: #343a40; color: white; }
        .content { margin-left: 250px; padding: 30px; }
    </style>
</head>
<body class="bg-light">

<div class="sidebar">
    <h4 class="text-center">ADMIN MASTER</h4>
    <hr>
    <a onclick="location.reload()"><i class="bi bi-people me-2"></i>Gerenciar Usuários</a>
    <a href="index.html"><i class="bi bi-house me-2"></i>Ir para Consultas</a>
    <a onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a>
</div>

<div class="content">
    <h3>Novo Usuário</h3>
    <div class="card shadow-sm p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" id="newName" class="form-control" placeholder="Nome Completo">
            </div>
            <div class="col-md-3">
                <input type="text" id="newMatricula" class="form-control" placeholder="Matrícula (Login)">
            </div>
            <div class="col-md-3">
                <input type="password" id="newSenha" class="form-control" placeholder="Senha Inicial">
            </div>
            <div class="col-md-3">
                <button onclick="criarUsuario()" class="btn btn-primary w-100">Criar Usuário</button>
            </div>
        </div>
    </div>

    <h3>Usuários Ativos</h3>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr><th>Matrícula</th><th>Nome</th><th>Ações</th></tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "http://127.0.0.1:8001";

    async function criarUsuario() {
        const nome = document.getElementById('newName').value;
        const matricula = document.getElementById('newMatricula').value;
        const senha = document.getElementById('newSenha').value;
        
        if(!nome || !matricula || !senha) return alert("Preencha todos os campos.");

        try {
            const res = await fetch(`${API}/admin/criar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome_completo: nome, matricula: matricula, senha: senha })
            });

            const data = await res.json();

            if (res.ok) {
                alert(data.msg);
                document.getElementById('newName').value = "";
                document.getElementById('newMatricula').value = "";
                document.getElementById('newSenha').value = "";
                carregarUsuarios();
            } else {
                alert("Erro: " + (data.detail || "Falha ao criar"));
            }
        } catch (err) {
            alert("Erro de conexão com o servidor.");
        }
    }

    async function carregarUsuarios() {
        const res = await fetch(`${API}/admin/listar-usuarios`);
        const dados = await res.json();
        const tbody = document.getElementById('listaUsuarios');
        tbody.innerHTML = dados.map(u => `
            <tr>
                <td>${u.matricula}</td>
                <td>${u.nome}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="resetarSenha(${u.id})">Resetar Senha</button>
                    <button class="btn btn-danger btn-sm" onclick="removerUsuario(${u.id})">Excluir</button>
                </td>
            </tr>
        `).join('');
    }

    async function resetarSenha(id) {
        if(!confirm("Resetar senha para 'pms123' e forçar troca?")) return;
        const res = await fetch(`${API}/admin/reset-senha/${id}`, { method: 'POST' });
        const data = await res.json();
        alert(data.msg);
    }

    async function removerUsuario(id) {
        if(!confirm("Excluir permanentemente este acesso?")) return;
        await fetch(`${API}/admin/usuario/${id}`, { method: 'DELETE' });
        carregarUsuarios();
    }

    function logout() { sessionStorage.clear(); window.location.href = "login.html"; }
    window.onload = carregarUsuarios;
</script>
</body>
</html>
