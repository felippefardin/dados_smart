<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Dados Smart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Segurança: Bloqueia acesso de utilizadores que não são MASTER
        if (!sessionStorage.getItem("usuarioLogado") || sessionStorage.getItem("tipoUsuario") !== "master") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { background: #343a40; color: white; }
        .sidebar a.active { background: #0d6efd; color: white; }
        .content { padding: 20px; }
        .status-pendente { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h4 class="text-center">ADMIN</h4>
            <hr>
            <a href="#" class="active">Utilizadores Pendentes</a>
            <a href="index.html">Voltar ao Sistema</a>
            <a href="#" onclick="logout()">Sair</a>
        </div>

        <div class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestão de Acessos</h2>
                <span class="badge bg-primary">Olá, <span id="nomeAdmin"></span></span>
            </div>

            <div class="card shadow">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Solicitações de Cadastro</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matrícula</th>
                                <th>E-mail</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaPendentes">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('nomeAdmin').innerText = sessionStorage.getItem("nomeUsuario");

    // Função para carregar utilizadores (Simulação ou integração com API)
    async function carregarPendentes() {
        // Nota: Você pode criar uma rota @app.get("/admin/usuarios") no main.py para listar todos do banco
        // Aqui está um exemplo de como tratar a linha da tabela dinamicamente
        const lista = document.getElementById('listaPendentes');
        
        // Exemplo de como a função de aprovação funciona:
        window.processarAcesso = async (id, acao) => {
            const res = await fetch(`http://127.0.0.1:8000/auth/aprovar/${id}?acao=${acao}`);
            const msg = await res.text();
            alert(msg);
            location.reload(); // Recarrega a lista
        };
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }

    carregarPendentes();
</script>

</body>
</html>
