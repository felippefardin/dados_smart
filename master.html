<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Dados Smart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Segurança: Bloqueia acesso de utilizadores que não são MASTER
        if (!sessionStorage.getItem("usuarioLogado") || sessionStorage.getItem("tipoUsuario") !== "master") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; position: fixed; width: inherit; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { background: #343a40; color: white; }
        .sidebar a.active { background: #0d6efd; color: white; }
        .content { margin-left: 16.666667%; padding: 20px; width: 83.333333%; }
        .status-pendente { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h4 class="text-center">ADMIN</h4>
            <hr>
            <a href="#" class="active">Utilizadores Pendentes</a>
            <a href="index.html">Voltar ao Sistema</a>
            <a href="#" onclick="logout()">Sair</a>
        </div>

        <div class="col-md-10 content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Gestão de Acessos</h2>
                <span class="badge bg-primary">Olá, <span id="nomeAdmin"></span></span>
            </div>

            <div class="card shadow">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Solicitações de Cadastro</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Matrícula</th>
                                <th>E-mail</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaPendentes">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('nomeAdmin').innerText = sessionStorage.getItem("nomeUsuario");

    // Função para carregar usuários pendentes do banco de dados
    async function carregarPendentes() {
        try {
            const res = await fetch("http://127.0.0.1:8000/admin/usuarios-pendentes");
            const usuarios = await res.json();
            const lista = document.getElementById('listaPendentes');
            lista.innerHTML = ""; 

            if (usuarios.length === 0) {
                lista.innerHTML = "<tr><td colspan='5' class='text-center'>Nenhuma solicitação pendente.</td></tr>";
                return;
            }

            usuarios.forEach(user => {
                lista.innerHTML += `
                    <tr>
                        <td>${user.nome}</td>
                        <td>${user.matricula}</td>
                        <td>${user.email}</td>
                        <td class="status-pendente">Pendente</td>
                        <td>
                            <button class="btn btn-sm btn-success" onclick="processarAcesso(${user.id}, 1)">Autorizar</button>
                            <button class="btn btn-sm btn-danger" onclick="processarAcesso(${user.id}, -1)">Negar</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("Erro ao carregar usuários:", error);
        }
    }

    // Função para aprovar ou negar
    window.processarAcesso = async (id, acao) => {
        if (!confirm(acao === 1 ? "Autorizar este usuário?" : "Remover esta solicitação?")) return;
        
        try {
            const res = await fetch(`http://127.0.0.1:8000/auth/aprovar/${id}?acao=${acao}`);
            const msg = await res.text();
            alert(msg);
            carregarPendentes(); // Recarrega a lista sem dar refresh na página toda
        } catch (error) {
            alert("Erro ao processar solicitação.");
        }
    };

    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }

    // Inicia a carga de dados
    carregarPendentes();
</script>

</body>
</html>
