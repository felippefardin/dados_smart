<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Painel Integrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .modal-xl { max-width: 90%; }
        .table-responsive { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow no-print mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Gerador de Relatórios Consolidados</h4>
        </div>
        <div class="card-body">
            <form id="formConsulta" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Tipo de Pesquisa:</label>
                    <select id="tipoPesquisa" class="form-select">
                        <option value="documento">CPF / CNPJ</option>
                        <option value="cda">Número da CDA</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-bold">Identificador (Número):</label>
                    <input type="text" id="documento" class="form-control" placeholder="Digite apenas números">
                </div>
                
                <div class="col-12">
                    <h6>Campos para o Relatório:</h6>
                    <div id="opcoes-campos" class="p-3 border rounded bg-white">
                        <input class="coluna-opt" type="checkbox" value="nome" checked> Nome 
                        <input class="coluna-opt" type="checkbox" value="documento" checked> Documento 
                        <input class="coluna-opt" type="checkbox" value="exercicio" checked> Exercício
                        <input class="coluna-opt" type="checkbox" value="valor_divida" checked> Valor 
                        <input class="coluna-opt" type="checkbox" value="status" checked> Status
                        <input class="coluna-opt" type="checkbox" value="estornado" checked> Estornado
                        <input class="coluna-opt" type="checkbox" value="endereco" checked> Endereço
                    </div>
                </div>
                <div class="col-12">
                    <button type="button" id="btnConsultar" onclick="consultar()" class="btn btn-success me-2">Visualizar Tabela</button>
                    <button type="button" onclick="baixarPDF()" class="btn btn-danger">Gerar PDF</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Relatório de Consulta Smart</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="table-responsive" id="conteudoTabela"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" onclick="window.print()">Imprimir</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";
let bootstrapModal;

document.addEventListener('DOMContentLoaded', () => {
    bootstrapModal = new bootstrap.Modal(document.getElementById('modalResultado'));
});

async function consultar() {
    const doc = document.getElementById('documento').value;
    const tipo = document.getElementById('tipoPesquisa').value;
    const btn = document.getElementById('btnConsultar');

    if (!doc) return alert("Insira um número para pesquisa.");

    // Feedback Visual
    btn.disabled = true;
    btn.innerText = "Consultando...";

    try {
        const res = await fetch(`${API_URL}/consultar?documento=${doc}&tipo=${tipo}`);
        const dados = await res.json();
        if (res.ok) {
            renderizarTabela(dados);
            bootstrapModal.show();
        } else {
            alert("Erro: " + (dados.detail || "Falha na consulta"));
        }
    } catch (e) { 
        alert("Erro de conexão com o servidor."); 
    } finally {
        btn.disabled = false;
        btn.innerText = "Visualizar Tabela";
    }
}

function renderizarTabela(dados) {
    const conteudo = document.getElementById('conteudoTabela');
    const colunas = Array.from(document.querySelectorAll('.coluna-opt:checked')).map(cb => ({
        id: cb.value,
        label: cb.nextSibling.textContent.trim()
    }));

    let html = `<table class="table table-bordered table-striped"><thead><tr>`;
    colunas.forEach(col => html += `<th>${col.label}</th>`);
    html += `</tr></thead><tbody><tr>`;

    const item = Array.isArray(dados) ? dados[0] : dados;
    colunas.forEach(col => {
        let valor = item[col.id] || "Nada Consta";
        html += `<td>${valor}</td>`;
    });
    html += `</tr></tbody></table>`;
    conteudo.innerHTML = html;
}

function baixarPDF() {
    const doc = document.getElementById('documento').value;
    const tipo = document.getElementById('tipoPesquisa').value;
    if (!doc) return alert("Digite um identificador.");
    window.open(`${API_URL}/gerar-pdf/${doc}?tipo=${tipo}`, '_blank');
}
</script>
</body>
</html>
