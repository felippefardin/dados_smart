<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Smart - Painel Integrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --bg-gradient: linear-gradient(135deg, #f8f9ff 0%, #e0e7ff 100%);
        }

        body { 
            background: var(--bg-gradient);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2b2d42;
        }

        @media print { .no-print { display: none !important; } }
        
        .search-card { 
            border-radius: 24px; 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); 
            border: 1px solid rgba(255,255,255,0.3);
        }

        .feriados-card {
            border-radius: 20px;
            border: none;
            background: #fff;
            height: 100%;
        }

        .feriado-item {
            font-size: 0.85rem;
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.2s;
        }

        .feriado-item:hover {
            background: #f8fafc;
        }

        .opcoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            background: #fcfcfd;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #f1f5f9;
        }

        .coluna-item {
            background: white;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .table-responsive { max-height: 70vh; border-radius: 0 0 20px 20px; }
        thead th { background-color: #f8fafc !important; color: #64748b !important; font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container-fluid py-5">
    <div class="row px-lg-5">
        
        <div class="col-lg-3 no-print mb-4">
            <div class="card feriados-card shadow-sm">
                <div class="card-header bg-white py-3 border-0">
                    <h6 class="mb-0 fw-bold text-primary"><i class="bi bi-calendar-event me-2"></i>Feriados Nacionais</h6>
                    <small class="text-muted">Controle de Prazos</small>
                </div>
                <div class="card-body p-0" id="listaFeriados" style="max-height: 600px; overflow-y: auto;">
                    <div class="p-4 text-center text-muted small">
                        <div class="spinner-border spinner-border-sm mb-2" role="status"></div><br>
                        Carregando calendário...
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <div class="text-center mb-5 no-print">
                <h2 class="fw-bold" style="color: #1e293b;">Dados Smart</h2>
                <p class="text-muted">Gestão Inteligente de Dados e Tributos</p>
            </div>

            <div class="card search-card no-print">
                <div class="card-header bg-transparent p-4 border-bottom">
                    <h4 class="mb-0 text-primary fw-bold"><i class="bi bi-filter-right me-2"></i>Gerador de Relatórios</h4>
                </div>
                <div class="card-body p-lg-5">
                    <form id="formConsulta" class="row g-4">
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-muted small">TIPO DE PESQUISA</label>
                            <select id="tipoPesquisa" class="form-select shadow-sm">
                                <option value="documento">CPF / CNPJ</option>
                                <option value="cda">Número da CDA</option>
                            </select>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label fw-bold text-muted small">IDENTIFICADOR</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-hash text-primary"></i></span>
                                <input type="text" id="documento" class="form-control border-start-0" placeholder="Digite apenas números">
                            </div>
                        </div>
                        
                        <div class="col-12">
                            <h6 class="fw-bold text-muted small text-uppercase mb-3">Campos Visíveis no Relatório</h6>
                            <div id="opcoes-campos" class="opcoes-grid shadow-sm">
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="nome" checked>
                                    <span>Nome</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="documento" checked>
                                    <span>Documento</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="data_nascimento" checked>
                                    <span>Nascimento</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="exercicio" checked>
                                    <span>Exercício</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="valor_divida" checked>
                                    <span>Valor</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="status" checked>
                                    <span>Status</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="estornado" checked>
                                    <span>Estornado</span>
                                </label>
                                <label class="coluna-item">
                                    <input class="form-check-input coluna-opt me-3" type="checkbox" value="endereco" checked>
                                    <span>Endereço</span>
                                </label>
                            </div>
                        </div>

                        <div class="col-12 d-flex flex-wrap gap-3 mt-4">
                            <button type="button" id="btnConsultar" onclick="consultar()" class="btn btn-primary px-4 shadow">
                                <i class="bi bi-lightning-charge-fill me-2"></i>Visualizar Tabela
                            </button>
                            <button type="button" onclick="baixarPDF()" class="btn btn-danger px-4 shadow">
                                <i class="bi bi-file-earmark-pdf-fill me-2"></i>PDF
                            </button>
                            <button type="button" onclick="baixarExcel()" class="btn btn-success px-4 shadow">
                                <i class="bi bi-file-earmark-excel-fill me-2"></i>Excel
                            </button>
                            <button type="button" onclick="logout()" class="btn btn-outline-secondary px-4 ms-auto">Sair</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content border-0">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold">Relatório Consolidado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive" id="conteudoTabela"></div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-2"></i>Imprimir</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = "http://127.0.0.1:8000";
let bootstrapModal;

document.addEventListener('DOMContentLoaded', () => {
    bootstrapModal = new bootstrap.Modal(document.getElementById('modalResultado'));
    
    // Segurança básica
    if (!sessionStorage.getItem("usuarioLogado")) {
        window.location.href = "login.html";
    }

    carregarFeriados();
});

async function carregarFeriados() {
    try {
        const res = await fetch(`${API_URL}/admin/feriados`);
        const feriados = await res.json();
        const container = document.getElementById('listaFeriados');
        
        if (feriados.length === 0) {
            container.innerHTML = '<div class="p-4 text-center text-muted small">Nenhum feriado encontrado.</div>';
            return;
        }

        container.innerHTML = feriados.map(f => `
            <div class="feriado-item d-flex align-items-center">
                <span class="badge bg-light text-primary border border-primary-subtle me-3" style="min-width: 55px;">
                    ${f.date.split('-').reverse().slice(0,2).join('/')}
                </span>
                <span class="text-dark fw-semibold" style="font-size: 0.8rem;">${f.name}</span>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('listaFeriados').innerHTML = '<div class="p-4 text-center text-danger small">Erro ao carregar calendário.</div>';
    }
}

async function consultar() {
    const docInput = document.getElementById('documento').value;
    const tipo = document.getElementById('tipoPesquisa').value;
    const btn = document.getElementById('btnConsultar');

    if (!docInput) return alert("Por favor, insira um número para pesquisa.");

    const docLimpo = docInput.replace(/\D/g, ''); 
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Processando...`;

    try {
        const res = await fetch(`${API_URL}/consultar?documento=${docLimpo}&tipo=${tipo}`);
        const dados = await res.json();
        
        if (res.ok) {
            renderizarTabela(dados);
            bootstrapModal.show();
        } else {
            alert("Erro: " + (dados.detail || "Falha na API"));
        }
    } catch (e) { 
        alert("Erro crítico: Verifique se o backend está rodando."); 
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-lightning-charge-fill me-2"></i>Visualizar Tabela`;
    }
}

function renderizarTabela(dados) {
    const conteudo = document.getElementById('conteudoTabela');
    const checkboxes = document.querySelectorAll('.coluna-opt:checked');
    
    const colunasSelecionadas = Array.from(checkboxes).map(cb => ({ 
        id: cb.value, 
        label: cb.parentElement.querySelector('span').innerText 
    }));

    let html = `<table class="table table-hover align-middle mb-0"><thead><tr>`;
    colunasSelecionadas.forEach(col => html += `<th>${col.label}</th>`);
    html += `</tr></thead><tbody>`;

    const listaResultados = Array.isArray(dados) ? dados : [dados];

    listaResultados.forEach(item => {
        html += `<tr>`;
        colunasSelecionadas.forEach(col => {
            let valor = item[col.id];
            if (valor === undefined || valor === null || valor === "") {
                valor = `<span class="text-muted small">N/A</span>`;
            }
            html += `<td>${valor}</td>`;
        });
        html += `</tr>`;
    });
    
    html += `</tbody></table>`;
    conteudo.innerHTML = html;
}

function baixarExcel() {
    const docInput = document.getElementById('documento').value;
    if (!docInput) return alert("Insira um número.");
    const docLimpo = docInput.replace(/\D/g, ''); 
    window.open(`${API_URL}/gerar-excel/${docLimpo}?tipo=${document.getElementById('tipoPesquisa').value}`, '_blank');
}

function baixarPDF() {
    const docInput = document.getElementById('documento').value;
    if (!docInput) return alert("Insira um número.");
    const docLimpo = docInput.replace(/\D/g, ''); 
    window.open(`${API_URL}/gerar-pdf/${docLimpo}?tipo=${document.getElementById('tipoPesquisa').value}`, '_blank');
}

function logout() {
    sessionStorage.clear();
    window.location.href = "login.html";
}
</script>
</body>
</html>
