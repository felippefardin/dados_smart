<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados Smart - Painel Integrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        @media print { .no-print { display: none !important; } }
        
        .search-card { border: none; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        
        /* Grid de Opções Estilizado */
        .opcoes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #dee2e6;
        }

        .coluna-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .coluna-item:hover { background: #e9ecef; border-color: #0d6efd; }

        /* Modal Full Screen */
        .modal-xl { max-width: 98vw; margin: 10px auto; }
        .modal-body { padding: 0; }
        .table-responsive { max-height: 80vh; width: 100%; }
        
        table { margin-bottom: 0 !important; white-space: nowrap; }
        thead { background-color: #212529; color: white; }

        @media (max-width: 576px) {
            .btn-group-mobile { display: flex; flex-direction: column; gap: 10px; }
            .btn-group-mobile .btn { width: 100%; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow search-card no-print mb-4">
        <div class="card-header bg-primary text-white p-3">
            <h4 class="mb-0"><i class="bi bi-search me-2"></i>Gerador de Relatórios Consolidados</h4>
        </div>
        <div class="card-body p-4">
            <form id="formConsulta" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary">Tipo de Pesquisa:</label>
                    <select id="tipoPesquisa" class="form-select border-primary shadow-sm">
                        <option value="documento">CPF / CNPJ</option>
                        <option value="cda">Número da CDA</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-bold text-secondary">Identificador (Número):</label>
                    <input type="text" id="documento" class="form-control border-primary shadow-sm" placeholder="Digite apenas números">
                </div>
                
                <div class="col-12">
                    <h6 class="fw-bold text-secondary mt-3">Campos para o Relatório:</h6>
                    <div id="opcoes-campos" class="opcoes-grid shadow-sm">
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="nome" id="f_nome" checked>
                            <span>Nome</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="documento" id="f_doc" checked>
                            <span>Documento</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="exercicio" id="f_exe" checked>
                            <span>Exercício</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="valor_divida" id="f_val" checked>
                            <span>Valor</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="status" id="f_sta" checked>
                            <span>Status</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="estornado" id="f_est" checked>
                            <span>Estornado</span>
                        </label>
                        <label class="coluna-item">
                            <input class="form-check-input coluna-opt me-2" type="checkbox" value="endereco" id="f_end" checked>
                            <span>Endereço</span>
                        </label>
                    </div>
                </div>

                <div class="col-12 btn-group-mobile mt-4">
                    <button type="button" id="btnConsultar" onclick="consultar()" class="btn btn-success me-md-2 px-4 fw-bold shadow-sm">
                        <i class="bi bi-table me-1"></i> Visualizar Tabela
                    </button>
                    <button type="button" onclick="baixarPDF()" class="btn btn-danger px-4 fw-bold shadow-sm">
                        <i class="bi bi-file-pdf me-1"></i> Gerar PDF
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title font-weight-bold">Relatório de Consulta Smart</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive" id="conteudoTabela"></div>
            </div>
            <div class="modal-footer bg-light no-print">
                <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary fw-bold" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i> Imprimir
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_URL = "http://127.0.0.1:8000";
let bootstrapModal;

document.addEventListener('DOMContentLoaded', () => {
    bootstrapModal = new bootstrap.Modal(document.getElementById('modalResultado'));
});

async function consultar() {
    const doc = document.getElementById('documento').value;
    const tipo = document.getElementById('tipoPesquisa').value;
    const btn = document.getElementById('btnConsultar');

    if (!doc) return alert("Insira um número para pesquisa.");

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Consultando...`;

    try {
        const res = await fetch(`${API_URL}/consultar?documento=${doc}&tipo=${tipo}`);
        const dados = await res.json();
        
        if (res.ok) {
            renderizarTabela(dados);
            bootstrapModal.show();
        } else {
            alert("Erro: " + (dados.detail || "Falha na consulta"));
        }
    } catch (e) { 
        alert("Erro de conexão com o servidor."); 
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-table me-1"></i> Visualizar Tabela`;
    }
}

function renderizarTabela(dados) {
    const conteudo = document.getElementById('conteudoTabela');
    const checkboxes = document.querySelectorAll('.coluna-opt:checked');
    
    // Mapeia colunas selecionadas
    const colunas = Array.from(checkboxes).map(cb => ({
        id: cb.value,
        label: cb.parentElement.querySelector('span').innerText
    }));

    // Cria tabela garantindo largura total
    let html = `<table class="table table-bordered table-striped table-hover w-100 align-middle">
                <thead><tr>`;
    colunas.forEach(col => html += `<th>${col.label}</th>`);
    html += `</tr></thead><tbody>`;

    // Garante que 'dados' seja tratado como lista (array)
    const listaResultados = Array.isArray(dados) ? dados : [dados];

    listaResultados.forEach(item => {
        html += `<tr>`;
        colunas.forEach(col => {
            // Busca o dado usando a chave definida no Python (ex: item['nome'])
            let valor = item[col.id] || "Nada Consta";
            html += `<td>${valor}</td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    conteudo.innerHTML = html;
}

function baixarPDF() {
    const doc = document.getElementById('documento').value;
    const tipo = document.getElementById('tipoPesquisa').value;
    if (!doc) return alert("Digite um identificador.");
    window.open(`${API_URL}/gerar-pdf/${doc}?tipo=${tipo}`, '_blank');
}
</script>
</body>
</html>
