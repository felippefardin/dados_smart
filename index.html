<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Relatórios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        @media print {
            .no-print { display: none !important; }
        }
        .modal-xl {
            max-width: 90%;
        }
        /* Garante que o modal não suma por erro de foco */
        .modal { background: rgba(0,0,0,0.5); }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow no-print">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Gerador de Relatórios</h4>
        </div>

        <div class="card-body">
            <form id="formConsulta" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label font-weight-bold">Documento (CPF ou CNPJ):</label>
                    <input type="text" id="documento" class="form-control" placeholder="Digite apenas números">
                </div>

                <div class="col-12">
                    <h6>Campos para o Relatório:</h6>
                    <div id="opcoes-campos" class="p-2 border rounded bg-white">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="nome" id="opt-nome" checked>
                            <label class="form-check-label" for="opt-nome">Nome</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="documento" id="opt-doc" checked>
                            <label class="form-check-label" for="opt-doc">Documento</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="valor_divida" id="opt-valor" checked>
                            <label class="form-check-label" for="opt-valor">Valor</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="data_vencimento" id="opt-venc" checked>
                            <label class="form-check-label" for="opt-venc">Vencimento</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="status" id="opt-status" checked>
                            <label class="form-check-label" for="opt-status">Status</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="tipo_pessoa" id="opt-tipo" checked>
                            <label class="form-check-label" for="opt-tipo">Tipo Pessoa</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="endereco" id="opt-end" checked>
                            <label class="form-check-label" for="opt-end">Endereço</label>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <button type="button" id="btnConsultar" class="btn btn-success">Visualizar Tabela</button>
                    <button type="button" id="btnPDF" class="btn btn-danger">Gerar PDF</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">DADOS SMART - RELATÓRIO OFICIAL</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="corpoModal">
                </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Sair</button>
                <button type="button" class="btn btn-danger" onclick="baixarPDF()">Baixar como PDF</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";
let bootstrapModal;

document.addEventListener('DOMContentLoaded', () => {
    // Inicialização do Modal
    bootstrapModal = new bootstrap.Modal(document.getElementById('modalResultado'));

    // Listeners com prevenção de comportamento padrão
    document.getElementById('btnConsultar').addEventListener('click', (e) => {
        e.preventDefault();
        consultar();
    });

    document.getElementById('btnPDF').addEventListener('click', (e) => {
        e.preventDefault();
        baixarPDF();
    });
});

function getCampos() {
    return [...document.querySelectorAll('.coluna-opt:checked')]
        .map(cb => cb.value)
        .join(',');
}

function escapeHTML(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

async function consultar() {
    const input = document.getElementById('documento');
    const doc = input.value.trim();

    if (!doc) {
        alert("Informe um documento (CPF ou CNPJ).");
        return;
    }

    const btn = document.getElementById('btnConsultar');
    btn.disabled = true;

    // Feedback visual de carregamento
    document.getElementById('corpoModal').innerHTML = `
        <div class='text-center py-5'>
            <div class="spinner-border text-primary" role="status"></div>
            <div class='mt-2'>Buscando dados na base oficial...</div>
        </div>`;
    
    bootstrapModal.show();

    try {
        const campos = getCampos();
        const response = await fetch(`${API_URL}/gerar-relatorio?documento=${doc}&campos_selecionados=${campos}`);

        if (!response.ok) throw new Error("Erro na comunicação com o servidor.");

        const dados = await response.json();
        renderTabela(dados, doc);

    } catch (error) {
        console.error(error);
        document.getElementById('corpoModal').innerHTML = `
            <div class='alert alert-danger text-center'>
                <h5>Erro ao carregar dados</h5>
                <p>${error.message}</p>
                <small>Verifique se o backend Python está rodando na porta 8000.</small>
            </div>`;
    } finally {
        btn.disabled = false;
    }
}

function renderTabela(dados, doc) {
    const nomesBonitos = {
        nome: "Nome Completo",
        documento: "Documento",
        valor_divida: "Valor do Débito",
        data_vencimento: "Vencimento",
        status: "Situação",
        tipo_pessoa: "Tipo",
        endereco: "Endereço"
    };

    let html = `
        <div class="alert alert-info py-2 mb-3">
            <strong>Documento Consultado:</strong> ${escapeHTML(doc)}
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover shadow-sm">
                <thead class="table-dark">
                    <tr>`;

    Object.keys(dados).forEach(key => {
        html += `<th>${escapeHTML(nomesBonitos[key] || key)}</th>`;
    });

    html += "</tr></thead><tbody><tr>";

    Object.values(dados).forEach(val => {
        let displayVal = val;
        // Formatação simples para moeda se for número
        if (typeof val === 'number') {
            displayVal = val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        html += `<td>${escapeHTML(String(displayVal))}</td>`;
    });

    html += "</tr></tbody></table></div>";

    document.getElementById('corpoModal').innerHTML = html;
}

function baixarPDF() {
    const doc = document.getElementById('documento').value.trim();
    if (!doc) {
        alert("Informe um documento antes de gerar o PDF.");
        return;
    }
    const campos = getCampos();
    window.open(`${API_URL}/gerar-pdf?documento=${doc}&campos_selecionados=${campos}`, '_blank');
}
</script>

</body>
</html>
