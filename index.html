<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Relatórios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .modal-xl { max-width: 90%; }
        .modal { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-light">

<script>
    if (sessionStorage.getItem("usuarioLogado") !== "true") {
        window.location.href = "login.html";
    }
</script>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <h5 id="boasVindas"></h5>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair do Sistema</button>
    </div>

    <div class="card shadow no-print">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Gerador de Relatórios</h4>
        </div>
        <div class="card-body">
            <form id="formConsulta" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label font-weight-bold">Documento (CPF ou CNPJ):</label>
                    <input type="text" id="documento" class="form-control" placeholder="Digite apenas números">
                </div>
                <div class="col-12">
                    <h6>Campos para o Relatório:</h6>
                    <div id="opcoes-campos" class="p-2 border rounded bg-white">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="nome" id="opt-nome" checked>
                            <label class="form-check-label" for="opt-nome">Nome</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="documento" id="opt-doc" checked>
                            <label class="form-check-label" for="opt-doc">Documento</label>
                        </div>
                        </div>
                </div>
                <div class="col-12">
                    <button type="button" id="btnConsultar" class="btn btn-success">Visualizar Tabela</button>
                    <button type="button" id="btnPDF" class="btn btn-danger">Gerar PDF</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalResultado" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    </div>

<script>
const API_URL = "http://127.0.0.1:8000";
let bootstrapModal;

document.addEventListener('DOMContentLoaded', () => {
    // Exibe nome do usuário
    const nome = sessionStorage.getItem("nomeUsuario");
    if(nome) document.getElementById('boasVindas').innerText = `Olá, ${nome.split(' ')[0]}`;

    bootstrapModal = new bootstrap.Modal(document.getElementById('modalResultado'));

    document.getElementById('btnConsultar').addEventListener('click', (e) => {
        e.preventDefault();
        consultar();
    });

    document.getElementById('btnPDF').addEventListener('click', (e) => {
        e.preventDefault();
        baixarPDF();
    });
});

function logout() {
    sessionStorage.clear();
    window.location.href = "login.html";
}

// ... Restante das funções consultar(), renderTabela(), etc (mantenha as suas) ...
</script>
</body>
</html>
