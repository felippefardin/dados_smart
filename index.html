<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Relatórios Consolidados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        @media print { .no-print { display: none !important; } }
        .modal-xl { max-width: 90%; }
        .table-responsive { max-height: 600px; overflow-y: auto; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <h5 id="boasVindas">Painel de Consulta Dados Smart</h5>
    </div>

    <div class="card shadow no-print mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Gerador de Relatórios</h4>
        </div>
        <div class="card-body">
            <form id="formConsulta" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Documento (CPF ou CNPJ):</label>
                    <input type="text" id="documento" class="form-control" placeholder="Digite apenas números">
                </div>
                <div class="col-12">
                    <h6>Campos para o Relatório:</h6>
                    <div id="opcoes-campos" class="p-3 border rounded bg-white">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="nome" id="opt-nome" checked>
                            <label class="form-check-label" for="opt-nome">Nome/Razão Social</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="documento" id="opt-doc" checked>
                            <label class="form-check-label" for="opt-doc">Documento</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="valor_divida" id="opt-valor" checked>
                            <label class="form-check-label" for="opt-valor">Valor da Dívida</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="data_vencimento" id="opt-venc" checked>
                            <label class="form-check-label" for="opt-venc">Data de Vencimento</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="status" id="opt-status" checked>
                            <label class="form-check-label" for="opt-status">Situação/Status</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input coluna-opt" type="checkbox" value="endereco" id="opt-end">
                            <label class="form-check-label" for="opt-end">Endereço/Município</label>
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <button type="button" onclick="consultar()" class="btn btn-success me-2">Visualizar Tabela</button>
                    <button type="button" onclick="baixarPDF()" class="btn btn-danger">Gerar PDF</button>
                </div>
            </form>
        </div>
    </div>

    <div id="resultadoTabela" class="card shadow d-none">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>Resultado da Consulta</span>
            <button class="btn btn-sm btn-light no-print" onclick="window.print()">Imprimir</button>
        </div>
        <div class="card-body">
            <div class="table-responsive" id="conteudoTabela">
                </div>
        </div>
    </div>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

async function consultar() {
    const docInput = document.getElementById('documento').value;
    if (!docInput) return alert("Por favor, insira um CPF ou CNPJ.");

    try {
        // Rota de consulta do backend que integra com a BrasilAPI ou Mock
        const res = await fetch(`${API_URL}/consultar?documento=${docInput}`);
        const dados = await res.json();

        if (res.ok) {
            renderizarTabela(dados);
        } else {
            alert("Erro na consulta: " + (dados.detail || "Erro desconhecido"));
        }
    } catch (error) {
        console.error("Erro de conexão:", error);
        alert("Não foi possível conectar ao servidor backend.");
    }
}

function renderizarTabela(dados) {
    const area = document.getElementById('resultadoTabela');
    const conteudo = document.getElementById('conteudoTabela');
    
    // Obtém apenas as colunas que o usuário marcou como visíveis
    const checkboxes = document.querySelectorAll('.coluna-opt:checked');
    const colunas = Array.from(checkboxes).map(cb => ({
        id: cb.value,
        label: cb.nextElementSibling.innerText
    }));

    if (colunas.length === 0) return alert("Selecione ao menos um campo para o relatório.");

    let html = `<table class="table table-bordered table-striped">
                    <thead class="table-secondary">
                        <tr>`;
    
    colunas.forEach(col => {
        html += `<th>${col.label}</th>`;
    });

    html += `</tr></thead><tbody>`;

    // Transforma objeto único em array para compatibilidade de loop se necessário
    const listaDados = Array.isArray(dados) ? dados : [dados];

    listaDados.forEach(item => {
        html += `<tr>`;
        colunas.forEach(col => {
            let valor = item[col.id] || "Nada Consta";
            html += `<td>${valor}</td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    conteudo.innerHTML = html;
    area.classList.remove('d-none');
}

function baixarPDF() {
    const doc = document.getElementById('documento').value;
    if (!doc) return alert("Digite um documento antes de gerar o PDF.");
    
    // Abre a rota de geração de PDF do seu backend em uma nova aba
    window.open(`${API_URL}/gerar-pdf/${doc}`, '_blank');
}
</script>
</body>
</html>
