<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cadastro PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded" style="max-width: 600px;">
        <h3>Cadastro de Usuário - PMS</h3>
        <div id="step1">
            <div id="mensagem" class="alert d-none" role="alert"></div>
            <input type="text" id="mat" class="form-control mb-2" placeholder="Matrícula PMS" required>
            <input type="text" id="cpf" class="form-control mb-2" placeholder="CPF (somente números)" required>
            <input type="text" id="nome" class="form-control mb-2" placeholder="Nome Completo" required>
            <input type="email" id="email" class="form-control mb-2" placeholder="E-mail" required>
            <input type="text" id="cel" class="form-control mb-2" placeholder="Celular">
            <label>Data Nascimento:</label>
            <input type="date" id="nasc" class="form-control mb-2">
            <input type="password" id="pass" class="form-control mb-1" placeholder="Senha Forte" required>
            <small class="text-muted d-block mb-3">Mínimo de 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
            <button onclick="pedirCodigo()" id="btnCadastro" class="btn btn-success w-100">Receber Código no E-mail</button>
        </div>

        <div id="step2" style="display:none;">
            <p class="text-primary">Insira o código enviado ao seu e-mail:</p>
            <input type="text" id="codigo" class="form-control mb-3" placeholder="Código 6 dígitos">
            <button onclick="finalizar()" class="btn btn-primary w-100">Validar Cadastro</button>
        </div>
    </div>

    <script>

       
        // Use apenas uma função para enviar o cadastro inicial
        function mostrarMensagem(texto, tipo = 'danger') {
            const caixa = document.getElementById('mensagem');
            caixa.textContent = texto;
            caixa.className = `alert alert-${tipo}`;
        }

        async function pedirCodigo() {
            // Coleta os dados usando os IDs corretos do HTML
            const dados = {
                matricula: document.getElementById('mat').value,
                cpf: document.getElementById('cpf').value,
                nome_completo: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                celular: document.getElementById('cel').value,
                data_nascimento: document.getElementById('nasc').value,
                senha: document.getElementById('pass').value
            };

            // Validação básica antes de enviar
            if (!dados.matricula || !dados.cpf || !dados.nome_completo || !dados.email || !dados.senha) {
                mostrarMensagem("Preencha matrícula, CPF, nome, e-mail e senha.");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dados.email)) {
                mostrarMensagem("Digite um endereço de e-mail válido.");
                return;
            }
            if (dados.senha.length < 8 || !/[a-z]/.test(dados.senha) || !/[A-Z]/.test(dados.senha) || !/\d/.test(dados.senha) || !/[^A-Za-z0-9]/.test(dados.senha)) {
                mostrarMensagem("A senha precisa ter 8 caracteres ou mais, com maiúscula, minúscula, número e símbolo.");
                return;
            }

            const botao = document.getElementById('btnCadastro');
            botao.disabled = true;
            botao.textContent = "Enviando...";
            try {
                const res = await fetch("http://127.0.0.1:8001/auth/cadastrar", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });

                const result = await res.json();

                if(res.ok) {
                    mostrarMensagem("Código enviado para o seu e-mail!", "success");
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    mostrarMensagem(result.detail || "Falha ao cadastrar.");
                }
            } catch (error) {
                console.error("Erro na conexão:", error);
                mostrarMensagem("Não foi possível conectar ao servidor. Execute INICIAR_DADOS_SMART.bat.");
            } finally {
                botao.disabled = false;
                botao.textContent = "Receber Código no E-mail";
            }
        }

        async function finalizar() {
            const email = document.getElementById('email').value;
            const codigo = document.getElementById('codigo').value;

            try {
                const res = await fetch("http://127.0.0.1:8001/auth/verificar-cadastro", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, codigo: codigo })
                });

                if(res.ok) {
                    alert("Cadastro realizado com sucesso!");
                    window.location.href = "login.html";
                } else {
                    const err = await res.json();
                    alert("Erro na verificação: " + err.detail);
                }
            } catch (error) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
