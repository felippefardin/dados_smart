<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro PMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded" style="max-width: 600px;">
        <h3>Cadastro de Usuário - PMS</h3>
        <div id="step1">
            <input type="text" id="mat" class="form-control mb-2" placeholder="Matrícula PMS">
            <input type="text" id="cpf" class="form-control mb-2" placeholder="CPF">
            <input type="text" id="nome" class="form-control mb-2" placeholder="Nome Completo">
            <input type="email" id="email" class="form-control mb-2" placeholder="E-mail">
            <input type="text" id="cel" class="form-control mb-2" placeholder="Celular">
            <label>Data Nascimento:</label>
            <input type="date" id="nasc" class="form-control mb-2">
            <input type="password" id="pass" class="form-control mb-3" placeholder="Senha Forte">
            <button onclick="pedirCodigo()" class="btn btn-success w-100">Receber Código no E-mail</button>
        </div>

        <div id="step2" style="display:none;">
            <p class="text-primary">Insira o código enviado ao seu e-mail:</p>
            <input type="text" id="codigo" class="form-control mb-3" placeholder="Código 6 dígitos">
            <button onclick="finalizar()" class="btn btn-primary w-100">Validar Cadastro</button>
        </div>
    </div>

    <script>

       
        // Use apenas uma função para enviar o cadastro inicial
        async function pedirCodigo() {
            // Coleta os dados usando os IDs corretos do HTML
            const dados = {
                matricula: document.getElementById('mat').value,
                cpf: document.getElementById('cpf').value,
                nome_completo: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                celular: document.getElementById('cel').value,
                data_nascimento: document.getElementById('nasc').value,
                senha: document.getElementById('pass').value
            };

            // Validação básica antes de enviar
            if (!dados.email || !dados.senha || !dados.matricula) {
                alert("Por favor, preencha os campos obrigatórios.");
                return;
            }

            try {
                const res = await fetch("http://127.0.0.1:8000/auth/cadastrar", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });

                const result = await res.json();

                if(res.ok) {
                    alert("Código enviado para o seu e-mail!");
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else {
                    alert("Erro: " + (result.detail || "Falha ao cadastrar"));
                }
            } catch (error) {
                console.error("Erro na conexão:", error);
                alert("Não foi possível conectar ao servidor. Verifique se o backend está rodando na porta 8000.");
            }
        }

        async function finalizar() {
            const email = document.getElementById('email').value;
            const codigo = document.getElementById('codigo').value;

            try {
                const res = await fetch("http://127.0.0.1:8000/auth/verificar-cadastro", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, codigo: codigo })
                });

                if(res.ok) {
                    alert("Cadastro realizado com sucesso!");
                    window.location.href = "login.html";
                } else {
                    const err = await res.json();
                    alert("Erro na verificação: " + err.detail);
                }
            } catch (error) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
