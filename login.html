<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .card-login { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body class="bg-light">
    <div id="notificacoes" class="toast-container"></div>

    <div class="card shadow card-login">
        <div class="card-header bg-primary text-white text-center"><h4>Acesso Dados Smart</h4></div>
        <div class="card-body">
            <div class="mb-3">
                <label>Matrícula PMS:</label>
                <input type="text" id="matricula" class="form-control" placeholder="Digite sua matrícula">
            </div>
            <div class="mb-3">
                <label>Senha:</label>
                <input type="password" id="senha" class="form-control" placeholder="Digite sua senha">
            </div>
            <button onclick="realizarLogin()" class="btn btn-primary w-100">Entrar</button>
            <hr>
            <div class="text-center">
                <a href="esqueci_senha.html" class="text-decoration-none">Esqueci minha senha</a><br>
                <a href="fazer_cadastro.html" class="text-decoration-none">Criar nova conta</a>
            </div>
        </div>
    </div>

    <script>
        function avisar(msg, tipo="info") {
            const id = 'toast' + Date.now();
            const html = `<div id="${id}" class="alert alert-${tipo} alert-dismissible fade show shadow">
                            ${msg} <button class="btn-close" data-bs-dismiss="alert"></button>
                          </div>`;
            document.getElementById('notificacoes').innerHTML += html;
            setTimeout(() => { 
                const el = document.getElementById(id);
                if(el) el.remove(); 
            }, 3000);
        }

        async function realizarLogin() {
            const matricula = document.getElementById('matricula').value;
            const senha = document.getElementById('senha').value;

            if (!matricula || !senha) {
                avisar("Preencha todos os campos.", "warning");
                return;
            }

            try {
                const res = await fetch("http://127.0.0.1:8000/auth/login", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({matricula, senha})
                });
                
                const dados = await res.json();

                if (res.ok) {
                    // Armazena os dados da sessão
                    sessionStorage.setItem("usuarioLogado", "true");
                    sessionStorage.setItem("nomeUsuario", dados.nome);
                    sessionStorage.setItem("tipoUsuario", dados.tipo_usuario);

                    avisar(dados.msg, "success");
                    
                    // Redirecionamento baseado no tipo de usuário retornado pelo servidor
                    setTimeout(() => { 
                        if (dados.tipo_usuario === "master") {
                            window.location.href = "master.html";
                        } else {
                            window.location.href = "index.html";
                        }
                    }, 2000);
                } else {
                    // Exibe a mensagem de erro detalhada do servidor (ex: "Pendente de aprovação")
                    avisar(dados.detail || "Erro ao realizar login.", "danger");
                }
            } catch (e) { 
                avisar("Erro ao conectar com o servidor. Verifique se o backend está rodando.", "danger"); 
            }
        }
    </script>
</body>
</html>
