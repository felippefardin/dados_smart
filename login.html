<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados Smart - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-login { max-width: 400px; margin: 100px auto; border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="card shadow card-login">
        <div class="card-header bg-primary text-white text-center">
            <h4>Acesso Restrito</h4>
            <small>Dados Smart Integrador</small>
        </div>
        <div class="card-body p-4">
            <div class="mb-3">
                <label class="form-label">Matrícula:</label>
                <input type="text" id="matricula" class="form-control" placeholder="Usuário">
            </div>
            <div class="mb-3">
                <label class="form-label">Senha:</label>
                <input type="password" id="senha" class="form-control" placeholder="Senha">
            </div>
            <button onclick="realizarLogin()" class="btn btn-primary w-100 py-2">Entrar</button>
            <a href="esqueci_senha.html" class="btn btn-link w-100 mt-2 text-decoration-none">Esqueci minha senha</a>
            <a href="fazer_cadastro.html" class="btn btn-outline-primary w-100">Criar conta</a>
            <div class="mt-4 text-center text-muted">
                <small><i class="bi bi-lock"></i> Acesso permitido apenas para servidores autorizados.</small>
            </div>
        </div>
    </div>

    <script>
        async function realizarLogin() {
            const matricula = document.getElementById('matricula').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch("http://127.0.0.1:8001/auth/login", {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({matricula, senha})
                });
                const dados = await res.json();

                if (res.ok) {
                    sessionStorage.setItem("matricula", matricula);
                    
                    if (dados.precisa_mudar_senha) {
                        alert("Primeiro Acesso ou Senha Resetada. Você deve criar uma nova senha agora.");
                        const nova = prompt("Digite sua nova senha definitiva:");
                        
                        if(!nova || nova === "pms123" || nova === senha) {
                            alert("Senha inválida ou muito fraca.");
                            return;
                        }
                        
                        const resTroca = await fetch("http://127.0.0.1:8001/auth/definir-nova-senha", {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ matricula: matricula, nova_senha: nova })
                        });
                        
                        if(resTroca.ok) {
                            alert("Senha atualizada! Por favor, faça login com a nova senha.");
                            location.reload();
                        }
                        return;
                    }

                    sessionStorage.setItem("usuarioLogado", "true");
                    sessionStorage.setItem("nomeUsuario", dados.nome);
                    sessionStorage.setItem("tipoUsuario", dados.tipo_usuario);
                    window.location.href = (dados.tipo_usuario === "master") ? "master.html" : "index.html";
                } else {
                    alert(dados.detail || "Erro ao realizar login");
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
